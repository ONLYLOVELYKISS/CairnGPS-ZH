name: Publish Chinese debug APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Unique release tag, for example zh-v1.1.2-preview"
        required: true
        type: string
      notes:
        description: "Optional additional notes for testers"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: chinese-debug-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require dispatch from main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::请从 main 分支运行中文测试包发布流程。"
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::release_tag 只能包含字母、数字、点、下划线和连字符，且必须以字母或数字开头。"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::发布标签 ${RELEASE_TAG} 已存在，请使用新的唯一标签。"
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Git 标签 ${RELEASE_TAG} 已存在，请使用新的唯一标签。"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Build and test
        run: ./gradlew :app:verifyUniversalDebugApk testDebugUnitTest

      - name: Prepare APK and release notes
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXTRA_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          version_name="$(grep -m1 '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          apk_src="app/build/outputs/apk/debug/app-debug.apk"
          apk_name="CairnGPS-${version_name}-zh-universal-debug.apk"

          if [ ! -f "$apk_src" ]; then
            echo "::error::找不到 Debug APK：${apk_src}"
            exit 1
          fi

          aapt2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 -print | sort -V | tail -n 1)"
          if [ -z "$aapt2" ]; then
            echo "::error::找不到 Android SDK 的 aapt2，无法验证 APK 包名。"
            exit 1
          fi
          badging="$($aapt2 dump badging "$apk_src")"
          echo "$badging" | grep -F "package: name='app.matthieu.cairngps'" >/dev/null || {
            echo "::error::APK Manifest 的 package 为空或不是 app.matthieu.cairngps。"
            exit 1
          }
          echo "$badging" | grep -F "native-code: 'arm64-v8a' 'armeabi-v7a' 'x86' 'x86_64'" >/dev/null || {
            echo "::error::APK 未包含完整的通用 ABI 集合。"
            exit 1
          }

          cp "$apk_src" "$apk_name"
          sha256sum "$apk_name" > "${apk_name}.sha256"

          {
            echo "# CairnGPS 简体中文测试版"
            echo
            echo "这是 CairnGPS-ZH 的简体中文通用 Debug 测试包（版本 ${version_name}）。"
            echo
            echo "- APK 是包含 arm64-v8a、armeabi-v7a、x86、x86_64 的单体通用包。"
            echo "- APK 使用 Android Debug 签名，仅供安装和功能测试。"
            echo "- 这不是正式发行版，不代表 Google Play 或其他应用商店版本。"
            echo "- 发布来源：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "- 提交：${GITHUB_SHA}"
            if [ -n "${EXTRA_NOTES}" ]; then
              echo
              echo "## 测试说明"
              printf '%s\n' "${EXTRA_NOTES}"
            fi
          } > RELEASE_NOTES.md

          printf 'VERSION_NAME=%s\nAPK_NAME=%s\n' "$version_name" "$apk_name" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cairngps-zh-universal-debug-${{ github.run_number }}
          path: |
            CairnGPS-*-zh-universal-debug.apk
            CairnGPS-*-zh-universal-debug.apk.sha256
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "CairnGPS 简体中文测试版 ${VERSION_NAME}" \
            --prerelease \
            --notes-file RELEASE_NOTES.md \
            "$APK_NAME" \
            "${APK_NAME}.sha256"